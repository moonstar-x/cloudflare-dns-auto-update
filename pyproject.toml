[project]
name = "cloudflare-dns-autoupdate"
version = "0.0.2"
description = "Keep Cloudflare DNS records synchronized with locally computed values."
readme = "README.md"
requires-python = ">=3.13"
license = "GPL-3.0-only"
dependencies = [
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "pyyaml>=6,<7",
  "watchfiles>=1,<2",
]

[project.scripts]
cloudflare-dns-autoupdate = "cloudflare_dns_autoupdate.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=1",
  "respx>=0.22",
  "ruff>=0.9",
  "mypy>=1.14",
  "types-PyYAML>=6",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
